<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Drawn as paths rather than text: a favicon renders at 16px on machines
       whose font stack we cannot predict, and a missing face would substitute
       silently. -->
  <rect width="32" height="32" fill="#f4f1ea"/>
  <g fill="#12110f">
    <rect x="8" y="6" width="4.2" height="20"/>
    <rect x="8" y="6" width="15" height="4"/>
    <rect x="8" y="14.2" width="11.5" height="3.6"/>
    <rect x="8" y="22" width="15" height="4"/>
  </g>
</svg>
